<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Stars Arena 2D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0b0c10; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background: #1f2833; display: block; }
        
        /* UI Overlay */
        .ui-panel { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 30px; border: 2px solid #66fcf1; }
        .score { font-size: 20px; font-weight: bold; }
        .blue-score { color: #45f3ff; }
        .red-score { color: #ff4757; }
        .timer { color: #f1c40f; font-size: 20px; font-weight: bold; }

        /* Character Select Overlay */
        #hero-select { position: absolute; inset: 0; background: rgba(11, 12, 16, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        #hero-select h1 { margin-bottom: 20px; color: #66fcf1; font-size: 32px; text-shadow: 0 0 10px #66fcf1; }
        .hero-list { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .hero-card { background: #1f2833; border: 2px solid #45a29e; border-radius: 12px; padding: 15px; width: 160px; text-align: center; cursor: pointer; transition: 0.3s; }
        .hero-card:hover { transform: translateY(-5px); border-color: #66fcf1; box-shadow: 0 0 15px #66fcf1; }
        .hero-card h3 { color: #66fcf1; margin-bottom: 5px; }
        .hero-card p { font-size: 12px; color: #c5c6c7; margin-bottom: 10px; }
        .btn-select { background: #66fcf1; color: #0b0c10; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* Mobile Controls */
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; pointer-events: none; }
        .btn-action { width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid #fff; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .btn-action:active { background: rgba(102, 252, 241, 0.6); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Top UI -->
    <div class="ui-panel">
        <div class="score blue-score">KO'K: <span id="blue-gems">0</span></div>
        <div class="timer" id="timer">02:00</div>
        <div class="score red-score">QIZIL: <span id="red-gems">0</span></div>
    </div>

    <!-- Hero Selection Screen -->
    <div id="hero-select">
        <h1>QAHRAMONNI TANLANG</h1>
        <div class="hero-list" id="hero-list"></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Map & Game Settings
const MAP_WIDTH = 2200;
const MAP_HEIGHT = 1400;

let gameTime = 120;
let gameOver = false;
let player = null;
let entities = [];
let crystals = [];
let particles = [];
let camera = { x: 0, y: 0 };

// Controls
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let mousePos = { x: 0, y: 0 };
window.addEventListener('mousemove', e => {
    mousePos.x = e.clientX;
    mousePos.y = e.clientY;
});

window.addEventListener('mousedown', () => {
    if (player && !player.dead) player.useSkill('basic');
});

// Map Static Elements
const bases = {
    blue: { x: 150, y: MAP_HEIGHT / 2, radius: 120 },
    red: { x: MAP_WIDTH - 150, y: MAP_HEIGHT / 2, radius: 120 }
};

const walls = [
    { x: 500, y: 300, w: 100, h: 300 },
    { x: 500, y: 800, w: 100, h: 300 },
    { x: MAP_WIDTH - 600, y: 300, w: 100, h: 300 },
    { x: MAP_WIDTH - 600, y: 800, w: 100, h: 300 },
    { x: MAP_WIDTH / 2 - 50, y: 200, w: 100, h: 200 },
    { x: MAP_WIDTH / 2 - 50, y: 1000, w: 100, h: 200 }
];

const bushes = [
    { x: 800, y: 200, r: 120 },
    { x: 800, y: 1080, r: 120 },
    { x: MAP_WIDTH - 800, y: 200, r: 120 },
    { x: MAP_WIDTH - 800, y: 1080, r: 120 },
    { x: MAP_WIDTH / 2 - 150, y: MAP_HEIGHT / 2 - 150, r: 100 },
    { x: MAP_WIDTH / 2 + 150, y: MAP_HEIGHT / 2 + 150, r: 100 }
];

// Hero Classes Config
const HEROES = {
    kael: { name: 'Kael', role: 'Tank', hp: 1500, speed: 4, color: '#3498db', desc: 'Qalqonli Ritsar (Melee)' },
    luna: { name: 'Luna', role: 'Mage', hp: 800, speed: 4.5, color: '#9b59b6', desc: 'Plazma Sehrgari (Ranged)' },
    drax: { name: 'Drax', role: 'Marksman', hp: 900, speed: 4.8, color: '#e67e22', desc: 'Lazer Mergani (Fast DPS)' },
    zola: { name: 'Zola', role: 'Assassin', hp: 850, speed: 5.2, color: '#e74c3c', desc: 'Soya Qotili (Fast/Stealth)' },
    eliza: { name: 'Eliza', role: 'Support', hp: 1000, speed: 4.3, color: '#2ecc71', desc: 'Bio-Shifokor (Healer)' }
};

// Entity Class
class Character {
    constructor(x, y, heroKey, team, isBot = false) {
        this.x = x;
        this.y = y;
        this.heroKey = heroKey;
        this.hero = HEROES[heroKey];
        this.team = team;
        this.isBot = isBot;
        
        this.maxHp = this.hero.hp;
        this.hp = this.maxHp;
        this.radius = 25;
        this.speed = this.hero.speed;
        this.gems = 0;
        this.dead = false;
        this.inBush = false;
        
        this.angle = 0;
        this.cooldowns = { skill1: 0, ult: 0 };
    }

    update() {
        if (this.dead) return;

        // Base Healing
        const base = bases[this.team];
        if (Math.hypot(this.x - base.x, this.y - base.y) < base.radius) {
            this.hp = Math.min(this.maxHp, this.hp + 2);
        }

        // Bush Check
        this.inBush = bushes.some(b => Math.hypot(this.x - b.x, this.y - b.y) < b.r);

        // Cooldown Reduction
        if (this.cooldowns.skill1 > 0) this.cooldowns.skill1 -= 1/60;
        if (this.cooldowns.ult > 0) this.cooldowns.ult -= 1/60;

        if (this.isBot) this.updateBotLogic();
    }

    move(dx, dy) {
        if (this.dead) return;
        let nextX = this.x + dx * this.speed;
        let nextY = this.y + dy * this.speed;

        // Wall Collision
        walls.forEach(w => {
            if (nextX + this.radius > w.x && nextX - this.radius < w.x + w.w &&
                nextY + this.radius > w.y && nextY - this.radius < w.y + w.h) {
                nextX = this.x;
                nextY = this.y;
            }
        });

        // Map Bounds
        this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, nextX));
        this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, nextY));
    }

    useSkill(type) {
        if (this.dead) return;

        if (type === 'basic') {
            // Basic Attack Logic
            createProjectile(this.x, this.y, this.angle, this.team, 12, 100, this.hero.color);
        } else if (type === 'skill1' && this.cooldowns.skill1 <= 0) {
            this.cooldowns.skill1 = 5;
            if (this.heroKey === 'kael') this.x += Math.cos(this.angle) * 150; // Dash
            if (this.heroKey === 'eliza') this.hp = Math.min(this.maxHp, this.hp + 300); // Heal
            if (this.heroKey === 'luna') this.x += Math.cos(this.angle) * 200; // Teleport
        } else if (type === 'ult' && this.cooldowns.ult <= 0) {
            this.cooldowns.ult = 12;
            // Ult Effect placeholder
            createProjectile(this.x, this.y, this.angle, this.team, 20, 300, '#f1c40f', 40);
        }
    }

    updateBotLogic() {
        // Simple AI: Move towards center or crystals
        const targetX = MAP_WIDTH / 2;
        const targetY = MAP_HEIGHT / 2;
        const angle = Math.atan2(targetY - this.y, targetX - this.x);
        this.angle = angle;
        this.move(Math.cos(angle), Math.sin(angle));

        if (Math.random() < 0.02) this.useSkill('basic');
    }

    draw() {
        if (this.dead) return;
        
        // Hide if in bush and not same team
        if (this.inBush && this.team !== player.team) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        // Body
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.hero.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = this.team === 'blue' ? '#3498db' : '#e74c3c';
        ctx.stroke();

        // Direction Indicator
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(this.angle) * 35, Math.sin(this.angle) * 35);
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // HP Bar
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-30, -45, 60, 8);
        ctx.fillStyle = this.team === 'blue' ? '#2ecc71' : '#e74c3c';
        ctx.fillRect(-30, -45, (this.hp / this.maxHp) * 60, 8);

        ctx.restore();
    }
}

// Projectile System
let projectiles = [];
function createProjectile(x, y, angle, team, speed, damage, color, radius = 8) {
    projectiles.push({ x, y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed, team, damage, color, radius, life: 60 });
}

// Init Game
function initHeroSelection() {
    const container = document.getElementById('hero-list');
    Object.keys(HEROES).forEach(key => {
        const h = HEROES[key];
        const card = document.createElement('div');
        card.className = 'hero-card';
        card.innerHTML = `
            <h3>${h.name}</h3>
            <p><strong>${h.role}</strong></p>
            <p>${h.desc}</p>
            <button class="btn-select">TANLASH</button>
        `;
        card.onclick = () => startGame(key);
        container.appendChild(card);
    });
}

function startGame(selectedHero) {
    document.getElementById('hero-select').style.display = 'none';

    // Player
    player = new Character(bases.blue.x, bases.blue.y, selectedHero, 'blue');
    entities.push(player);

    // Bots (2 Blue, 3 Red)
    const keys = Object.keys(HEROES);
    entities.push(new Character(bases.blue.x, bases.blue.y - 100, keys[1], 'blue', true));
    entities.push(new Character(bases.blue.x, bases.blue.y + 100, keys[2], 'blue', true));

    entities.push(new Character(bases.red.x, bases.red.y, keys[3], 'red', true));
    entities.push(new Character(bases.red.x, bases.red.y - 100, keys[4], 'red', true));
    entities.push(new Character(bases.red.x, bases.red.y + 100, keys[0], 'red', true));

    // Spawn Crystals periodically
    setInterval(() => {
        if (crystals.length < 10) {
            crystals.push({
                x: MAP_WIDTH / 2 + (Math.random() - 0.5) * 200,
                y: MAP_HEIGHT / 2 + (Math.random() - 0.5) * 200
            });
        }
    }, 5000);

    requestAnimationFrame(gameLoop);
}

// Main Game Loop
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Controls
    if (player && !player.dead) {
        let dx = 0, dy = 0;
        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;
        
        if (dx !== 0 || dy !== 0) player.move(dx, dy);

        // Aim Angle
        const screenCenterX = canvas.width / 2;
        const screenCenterY = canvas.height / 2;
        player.angle = Math.atan2(mousePos.y - screenCenterY, mousePos.x - screenCenterX);

        if (keys['e']) player.useSkill('skill1');
        if (keys['space']) player.useSkill('ult');
    }

    // Camera follow player
    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Draw Bases
    ['blue', 'red'].forEach(t => {
        const b = bases[t];
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = t === 'blue' ? 'rgba(52, 152, 219, 0.2)' : 'rgba(231, 76, 60, 0.2)';
        ctx.fill();
    });

    // Draw Walls
    ctx.fillStyle = '#2c3e50';
    walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

    // Draw Bushes
    ctx.fillStyle = 'rgba(46, 204, 113, 0.4)';
    bushes.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw Crystals
    crystals.forEach((c, idx) => {
        ctx.fillStyle = '#9b59b6';
        ctx.beginPath();
        ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
        ctx.fill();

        // Pickup Check
        entities.forEach(e => {
            if (!e.dead && Math.hypot(e.x - c.x, e.y - c.y) < e.radius) {
                e.gems++;
                crystals.splice(idx, 1);
            }
        });
    });

    // Update & Draw Entities
    entities.forEach(e => {
        e.update();
        e.draw();
    });

    // Projectiles
    projectiles.forEach((p, idx) => {
        p.x += p.dx;
        p.y += p.dy;
        p.life--;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        // Hit Check
        entities.forEach(e => {
            if (!e.dead && e.team !== p.team && Math.hypot(e.x - p.x, e.y - p.y) < e.radius + p.radius) {
                e.hp -= p.damage;
                p.life = 0;
                if (e.hp <= 0) {
                    e.dead = true;
                    e.gems = 0;
                    setTimeout(() => { e.hp = e.maxHp; e.dead = false; e.x = bases[e.team].x; e.y = bases[e.team].y; }, 5000);
                }
            }
        });

        if (p.life <= 0) projectiles.splice(idx, 1);
    });

    ctx.restore();

    // UI Scores Update
    let blueGems = entities.filter(e => e.team === 'blue').reduce((a, b) => a + b.gems, 0);
    let redGems = entities.filter(e => e.team === 'red').reduce((a, b) => a + b.gems, 0);
    document.getElementById('blue-gems').innerText = blueGems;
    document.getElementById('red-gems').innerText = redGems;

    requestAnimationFrame(gameLoop);
}

window.onload = initHeroSelection;
</script>
</body>
</html>
